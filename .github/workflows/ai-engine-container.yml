name: FastAPI Cloud AI Engine Validation

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "core/**"
      - "exchange_integration/**"
      - "fastapi_cloud_app.py"
      - "pyproject.toml"
      - "tests/test_fastapi_cloud_engine.py"
      - ".github/workflows/ai-engine-container.yml"
  pull_request:
    paths:
      - "agents/**"
      - "core/**"
      - "exchange_integration/**"
      - "fastapi_cloud_app.py"
      - "pyproject.toml"
      - "tests/test_fastapi_cloud_engine.py"
      - ".github/workflows/ai-engine-container.yml"

jobs:
  validate:
    name: Validate FastAPI Cloud runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ENGINE_SHARED_SECRET: ci-test-secret-1234567890-abcdefghijklmnopqrstuvwxyz
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile AI engine
        run: python -m compileall -q agents core exchange_integration fastapi_cloud_app.py

      - name: Run AI engine tests
        run: pytest -q tests/test_fastapi_cloud_engine.py
