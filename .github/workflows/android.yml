name: Build Mirei Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build paper debug APK
        run: gradle :app:testPaperDebugUnitTest :app:assemblePaperDebug --no-daemon
      - name: Fail if no unit-test reports were produced
        run: |
          count=$(find app/build/test-results/testPaperDebugUnitTest -name 'TEST-*.xml' -type f | wc -l)
          test "$count" -gt 0
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mirei-paper-debug-apk
          path: android/app/build/outputs/apk/paper/debug/app-paper-debug.apk
          retention-days: 3
