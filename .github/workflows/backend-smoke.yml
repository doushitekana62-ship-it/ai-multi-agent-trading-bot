name: Backend FastAPI Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/backend-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/backend-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_VERSION: "3.11"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CORS_ORIGINS: "https://localhost"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate required backend secrets
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$JWT_SECRET_KEY" || { echo "::error::Missing JWT_SECRET_KEY"; exit 1; }
          test "${#JWT_SECRET_KEY}" -ge 32 || { echo "::error::JWT_SECRET_KEY must be at least 32 characters"; exit 1; }
          test -n "$ADMIN_USERNAME" || { echo "::error::Missing ADMIN_USERNAME"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "::error::Missing ADMIN_PASSWORD"; exit 1; }
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Import FastAPI application
        run: python -c "from backend.api import app; print(app.title)"
      - name: Test health and readiness endpoints
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.api import app
          client = TestClient(app)
          health = client.get('/health')
          assert health.status_code == 200, health.text
          ready = client.get('/ready')
          assert ready.status_code == 200, ready.text
          print('health:', health.json())
          print('ready:', ready.status_code, ready.json())
          PY
