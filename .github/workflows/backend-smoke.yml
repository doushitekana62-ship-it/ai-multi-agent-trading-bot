name: Backend FastAPI Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'core/**'
      - 'agents/**'
      - 'exchange_integration/**'
      - 'integration/**'
      - 'paper_trading/**'
      - 'pyproject.toml'
      - '.github/workflows/backend-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-fastapi-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: FastAPI backend smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      AI_ENGINE_SHARED_SECRET: ci-test-secret-1234567890-abcdefghijklmnopqrstuvwxyz
      JWT_SECRET_KEY: ci-jwt-secret-1234567890-abcdefghijklmnopqrstuvwxyz
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-password
      CORS_ORIGINS: "https://doushitekana62-ship-it.github.io"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-timeout

      - name: Compile backend
        run: python -m compileall -q agents backend core exchange_integration integration paper_trading

      - name: Import canonical FastAPI application
        run: |
          python - <<'PY'
          from backend.api import APP_ENTRYPOINT, APP_VERSION, app
          assert APP_ENTRYPOINT == "backend.api:app"
          assert app.version == APP_VERSION
          print(f"FastAPI entrypoint: {APP_ENTRYPOINT}")
          print(f"FastAPI version: {APP_VERSION}")
          PY

      - name: Test health and readiness endpoints
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.api import app
          client = TestClient(app)
          health = client.get('/health')
          assert health.status_code == 200, health.text
          payload = health.json()
          assert payload['status'] == 'healthy'
          assert payload['entrypoint'] == 'backend.api:app'
          assert payload['paper_mode'] is True
          assert payload['real_trading_locked'] is True
          ready = client.get('/ready')
          assert ready.status_code == 200, ready.text
          assert ready.json()['entrypoint'] == 'backend.api:app'
          print('health:', payload)
          print('ready:', ready.json())
          PY

      - name: Run deployment contract tests
        run: pytest -q tests/test_deployment_contract.py tests/test_canonical_architecture_guards.py
