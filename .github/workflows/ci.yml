name: AI Trading Bot CI

on:
  push:
    branches: [main, indodax-integration-hardening]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q agents backend core exchange_integration integration paper_trading main.py api.py
