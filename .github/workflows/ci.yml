name: AI Trading Bot CI

on:
  push:
    branches: [main, indodax-integration-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q agents backend core exchange_integration integration paper_trading main.py api.py fronted fastapi_cloud_app.py
      - name: Run Cloudflare paper control contract tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pytest -q tests/test_cloudflare_paper_control_contract.py

  fastapi-cloud-engine:
    name: FastAPI Cloud AI engine validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ENGINE_SHARED_SECRET: ci-test-secret-1234567890-abcdefghijklmnopqrstuvwxyz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AI engine dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Run FastAPI Cloud engine integration tests
        run: pytest -q tests/test_fastapi_cloud_engine.py

  deployment-contract:
    name: Deployment contract validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deployment contract tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pytest -q tests/test_deployment_contract.py

  frontend-cloudflare:
    name: Frontend and Cloudflare validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fronted/package.json
      - name: Install frontend dependencies
        working-directory: fronted
        run: npm install --legacy-peer-deps
      - name: Build React dashboard
        working-directory: fronted
        run: npm run build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup uv
        run: python -m pip install --upgrade uv
      - name: Sync Python Worker dependencies
        working-directory: fronted
        run: uv sync --dev
      - name: Validate dashboard Cloudflare Worker
        working-directory: fronted
        run: uv run pywrangler deploy --dry-run
