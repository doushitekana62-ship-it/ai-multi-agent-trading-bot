name: AI Trading Bot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-trading-bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Full quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: production
      PYTHONPATH: .
      AI_ENGINE_SHARED_SECRET: ci-test-secret-1234567890-abcdefghijklmnopqrstuvwxyz
      JWT_SECRET_KEY: ci-jwt-secret-1234567890-abcdefghijklmnopqrstuvwxyz
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fronted/package.json

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-timeout

      - name: Compile Python sources
        run: python -m compileall -q agents backend core exchange_integration integration paper_trading main.py fastapi_cloud_app.py

      - name: Verify canonical FastAPI deployment contract
        run: |
          pytest -q \
            tests/test_deployment_contract.py \
            tests/test_canonical_architecture_guards.py \
            tests/test_fastapi_cloud_engine.py \
            tests/test_dashboard_feature_contract.py

      - name: Run deterministic trading tests
        run: |
          pytest -q \
            tests/test_dynamic_exit.py \
            tests/test_canonical_trading_pipeline.py \
            tests/test_ai_liveness_and_conflict.py \
            tests/test_v02_ledger_consistency.py \
            tests/test_trading_librarian.py \
            tests/test_paper_execution.py

      - name: Install frontend dependencies
        working-directory: fronted
        run: npm install --include=dev --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Build React dashboard for GitHub Pages
        working-directory: fronted
        env:
          VITE_API_URL: https://api.invalid.example
        run: npm run build

      - name: Verify Pages artifact structure
        run: test -f fronted/dist/index.html
