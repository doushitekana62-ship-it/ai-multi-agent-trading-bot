name: AI Trading Bot CI

on:
  push:
    branches: [main, indodax-integration-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q agents backend core exchange_integration integration paper_trading main.py api.py

  frontend-cloudflare:
    name: Frontend and Cloudflare validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: fronted
        run: npm install

      - name: Build React dashboard
        working-directory: fronted
        run: npm run build

      - name: Validate Cloudflare Worker
        working-directory: fronted
        run: npx wrangler deploy --dry-run
