name: Deploy AI Trading Dashboard to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "core/**"
      - "exchange_integration/**"
      - "fronted/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fronted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build React dashboard
        run: npm run build

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install Cloudflare Python Worker dependencies
        run: uv sync --dev

      - name: Validate dashboard Worker
        run: uv run pywrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy dashboard Worker
        run: |
          node --version
          uv run pywrangler --version
          uv run pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
