name: Validate Cloudflare Worker

# Cloudflare Workers Builds is the single production deployment path.
# This GitHub workflow validates the exact Python Worker package used for production.
# Production deployment remains owned by Cloudflare Workers Builds.

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "core/**"
      - "exchange_integration/**"
      - "fronted/**"
      - ".github/workflows/cloudflare-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "agents/**"
      - "core/**"
      - "exchange_integration/**"
      - "fronted/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate dashboard Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fronted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fronted/package.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build React dashboard
        run: npm run build

      - name: Setup uv
        run: python -m pip install --upgrade uv

      - name: Sync Python Worker dependencies
        run: uv sync --dev

      - name: Validate Python Worker bundle
        run: uv run pywrangler deploy --dry-run
