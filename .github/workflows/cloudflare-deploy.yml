name: Deploy AI Trading Dashboard to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "fronted/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fronted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build React dashboard
        run: npm run build

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Deploy Python Worker and static assets
        run: uvx --from workers-py pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
