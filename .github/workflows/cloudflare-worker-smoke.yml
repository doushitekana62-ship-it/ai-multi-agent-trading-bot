name: Cloudflare Worker Smoke Test

on:
  workflow_dispatch:

jobs:
  cloudflare-worker-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fronted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fronted/package.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build React dashboard
        run: npm run build

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Validate Cloudflare Worker bundle
        run: uvx --from workers-py pywrangler deploy --dry-run
