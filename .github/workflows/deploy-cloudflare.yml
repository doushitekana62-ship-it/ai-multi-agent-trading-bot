name: Deploy Cloudflare Trading Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "fronted/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dashboard:
    name: Build and deploy dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NODE_ENV: production
      API_ORIGIN: ${{ secrets.API_ORIGIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Validate Cloudflare deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$API_ORIGIN" || { echo "::error::Missing API_ORIGIN repository secret"; exit 1; }
          case "$API_ORIGIN" in
            http://*|https://*) ;;
            *) echo "::error::API_ORIGIN must start with http:// or https://"; exit 1 ;;
          esac

      - name: Install frontend dependencies
        working-directory: fronted
        run: npm install

      - name: Build React dashboard
        working-directory: fronted
        run: npm run build

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: fronted
          command: deploy
          secrets: |
            API_ORIGIN
