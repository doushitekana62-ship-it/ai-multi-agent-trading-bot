name: FastAPI Deployment Gate

on:
  workflow_run:
    workflows: ["AI Trading Bot CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastapi-deployment-gate
  cancel-in-progress: true

jobs:
  verify:
    name: Verify live FastAPI deployment
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FASTAPI_URL: ${{ vars.VITE_API_URL || 'https://ai-multi-agent-trading-bot-7ba9bcfc.fastapicloud.dev' }}
      EXPECTED_ENTRYPOINT: backend.api:app
      EXPECTED_VERSION: 2.0.0
    steps:
      - name: Checkout deployment contract
        uses: actions/checkout@v4

      - name: Verify repository entrypoint contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          config = Path('pyproject.toml').read_text(encoding='utf-8')
          assert 'entrypoint = "backend.api:app"' in config
          assert 'entrypoint = "fastapi_cloud_app:app"' not in config
          print('Repository entrypoint contract: backend.api:app')
          PY

      - name: Poll live deployment identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FASTAPI_URL"
          case "$FASTAPI_URL" in https://*) ;; *) echo "::error::FASTAPI_URL must use HTTPS"; exit 1 ;; esac
          health_url="${FASTAPI_URL%/}/health"
          echo "Checking $health_url"
          for attempt in $(seq 1 30); do
            response="$(curl --silent --show-error --location --max-time 10 "$health_url" || true)"
            if python - "$response" <<'PY'
          import json
          import sys
          try:
              payload = json.loads(sys.argv[1])
          except (ValueError, TypeError):
              raise SystemExit(1)
          ok = (
              payload.get('status') == 'healthy'
              and payload.get('entrypoint') == 'backend.api:app'
              and payload.get('version') == '2.0.0'
              and payload.get('paper_mode') is True
              and payload.get('real_trading_locked') is True
          )
          print(payload)
          raise SystemExit(0 if ok else 1)
          PY
            then
              echo "Live FastAPI deployment is canonical and healthy."
              exit 0
            fi
            echo "Attempt $attempt/30: deployment not yet serving the canonical contract; waiting 20s."
            sleep 20
          done
          echo "::error::Live FastAPI deployment did not expose the canonical backend.api:app contract within 10 minutes."
          exit 1

      - name: Verify live API docs are reachable
        run: |
          curl --fail --silent --show-error --location --max-time 15 "${FASTAPI_URL%/}/openapi.json" >/dev/null
          echo "Live OpenAPI endpoint is reachable."
