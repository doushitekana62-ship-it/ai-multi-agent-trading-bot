name: GitHub Pages Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'fronted/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ai-multi-agent-trading-bot-7ba9bcfc.fastapicloud.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fronted/package.json

      - name: Validate public API configuration
        run: |
          test -n "$VITE_API_URL" || { echo "::error::Missing VITE_API_URL"; exit 1; }
          case "$VITE_API_URL" in http://*|https://*) ;; *) echo "::error::VITE_API_URL must be an HTTP(S) URL"; exit 1 ;; esac

      - name: Install frontend dependencies
        working-directory: fronted
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Build dashboard
        working-directory: fronted
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fronted/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must be enabled with Source = GitHub Actions in repository settings.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
