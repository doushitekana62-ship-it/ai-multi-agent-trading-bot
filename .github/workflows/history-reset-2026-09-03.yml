name: History Reset 2026-09-03

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  backup-and-reset:
    if: contains(github.event.head_commit.message, '[history-reset-2026-09-03]')
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://opclkckfdlkqzunzmwym.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKER_URL: https://adeii.workers.dev
      BACKUP_FILE: history-reset-2026-09-03.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backup and reset credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY is required; refusing destructive reset.'; exit 1; }
          test -n "${{ secrets.ADMIN_USERNAME }}" || { echo 'ADMIN_USERNAME is required; refusing destructive reset.'; exit 1; }
          test -n "${{ secrets.ADMIN_PASSWORD }}" || { echo 'ADMIN_PASSWORD is required; refusing destructive reset.'; exit 1; }

      - name: Backup trading history
        shell: bash
        run: |
          set -euo pipefail
          : > "$BACKUP_FILE"
          printf '%s\n' '{"backup":"AI TRADING BOT — PRE-RESET PAPER LEDGER","created_at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}' >> "$BACKUP_FILE"
          tables=(decisions market_observations paper_history paper_integrity_events trades)
          for table in "${tables[@]}"; do
            offset=0
            while true; do
              response="$(curl --retry 5 --retry-delay 2 --fail-with-body --silent --show-error --get "$SUPABASE_URL/rest/v1/$table" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                --data-urlencode 'select=*' \
                --data-urlencode 'order=id.asc' \
                --data-urlencode 'limit=100' \
                --data-urlencode "offset=$offset")"
              count="$(jq 'length' <<<"$response")"
              jq -c --arg table "$table" '.[] | {table:$table,row:.}' <<<"$response" >> "$BACKUP_FILE"
              if [ "$count" -lt 100 ]; then break; fi
              offset=$((offset + 100))
            done
          done
          jq -e 'select(.backup)' "$BACKUP_FILE" >/dev/null
          test "$(wc -l < "$BACKUP_FILE")" -gt 1

      - name: Upload immutable backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-ledger-pre-reset-2026-09-03
          path: ${{ env.BACKUP_FILE }}
          if-no-files-found: error
          retention-days: 90

      - name: Commit backup before reset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$BACKUP_FILE"
          git commit -m 'backup: paper ledger before reset 2026-09-03' || { echo 'Backup commit was not created; refusing destructive reset.'; exit 1; }
          git push

      - name: Reset Durable Object and Supabase ledger
        shell: bash
        run: |
          set -euo pipefail
          login="$(jq -nc --arg username '${{ secrets.ADMIN_USERNAME }}' --arg password '${{ secrets.ADMIN_PASSWORD }}' '{username:$username,password:$password}')"
          auth="$(curl --retry 5 --retry-delay 2 --fail-with-body --silent --show-error -X POST "$WORKER_URL/api/auth/login" -H 'Content-Type: application/json' -d "$login")"
          token="$(jq -r '.access_token // empty' <<<"$auth")"
          test -n "$token" && test "$token" != "null" || { echo "Worker login failed: $auth"; exit 1; }
          reset="$(curl --retry 5 --retry-delay 2 --fail-with-body --silent --show-error -X POST "$WORKER_URL/api/bot/reset" -H "Authorization: Bearer $token")"
          echo "$reset" | jq .
          jq -e '.reset.ok == true' <<<"$reset" >/dev/null

      - name: Verify database reset
        shell: bash
        run: |
          set -euo pipefail
          for table in decisions market_observations paper_history trades; do
            rows="$(curl --retry 5 --retry-delay 2 --fail-with-body --silent --show-error --get "$SUPABASE_URL/rest/v1/$table" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              --data-urlencode 'select=id' \
              --data-urlencode 'limit=1')"
            test "$(jq 'length' <<<"$rows")" -eq 0 || { echo "$table is not empty"; exit 1; }
          done
          echo 'Paper ledger reset verified.'

      - name: Verify worker is OFF after reset
        shell: bash
        run: |
          set -euo pipefail
          login="$(jq -nc --arg username '${{ secrets.ADMIN_USERNAME }}' --arg password '${{ secrets.ADMIN_PASSWORD }}' '{username:$username,password:$password}')"
          auth="$(curl --retry 5 --retry-delay 2 --fail-with-body --silent --show-error -X POST "$WORKER_URL/api/auth/login" -H 'Content-Type: application/json' -d "$login")"
          token="$(jq -r '.access_token // empty' <<<"$auth")"
          status="$(curl --retry 5 --retry-delay 2 --fail-with-body --silent --show-error "$WORKER_URL/api/bot/status" -H "Authorization: Bearer $token")"
          echo "$status" | jq .
          jq -e '.bot_enabled == false and .active_positions == 0' <<<"$status" >/dev/null
