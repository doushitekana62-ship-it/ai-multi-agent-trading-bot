name: History Reset 2026-09-03

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  backup-and-reset:
    if: contains(github.event.head_commit.message, '[history-reset-2026-09-03]')
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://opclkckfdlkqzunzmwym.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_FILE: history reset 3 sept 2026.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backup credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY GitHub secret is required; refusing destructive reset.'; exit 1; }

      - name: Backup trading history
        shell: bash
        run: |
          set -euo pipefail
          : > "$BACKUP_FILE"
          printf '%s\n' 'AI TRADING BOT — HISTORY RESET 3 SEPT 2026' >> "$BACKUP_FILE"
          printf '%s\n' 'This file is a pre-reset JSONL snapshot of the canonical paper-trading tables.' >> "$BACKUP_FILE"
          printf '%s\n\n' 'Generated by GitHub Actions immediately before the destructive reset.' >> "$BACKUP_FILE"

          tables=(decisions market_observations paper_history paper_integrity_events trades)
          for table in "${tables[@]}"; do
            echo "TABLE $table" >> "$BACKUP_FILE"
            offset=0
            while true; do
              response="$(curl --retry 3 --retry-delay 2 --fail-with-body --silent --show-error --get "$SUPABASE_URL/rest/v1/$table" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                --data-urlencode 'select=*' \
                --data-urlencode 'order=id.asc' \
                --data-urlencode 'limit=100' \
                --data-urlencode "offset=$offset")"
              count="$(jq 'length' <<<"$response")"
              jq -c '.[]' <<<"$response" >> "$BACKUP_FILE"
              if [ "$count" -lt 100 ]; then break; fi
              offset=$((offset + 100))
            done
            printf '\n' >> "$BACKUP_FILE"
          done

      - name: Commit backup before reset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$BACKUP_FILE"
          git commit -m 'backup: history reset 3 sept 2026' || { echo 'Backup commit was not created; refusing destructive reset.'; exit 1; }
          git push

      - name: Reset canonical paper history tables
        shell: bash
        run: |
          set -euo pipefail
          for table in paper_history trades market_observations paper_integrity_events decisions; do
            echo "Resetting $table"
            curl --retry 3 --retry-delay 2 --fail-with-body --silent --show-error -X DELETE "$SUPABASE_URL/rest/v1/$table?id=not.is.null" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Prefer: return=minimal'
          done

      - name: Verify reset
        shell: bash
        run: |
          set -euo pipefail
          for table in decisions market_observations paper_history paper_integrity_events trades; do
            rows="$(curl --retry 3 --retry-delay 2 --fail-with-body --silent --show-error --get "$SUPABASE_URL/rest/v1/$table" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              --data-urlencode 'select=id' \
              --data-urlencode 'limit=1')"
            test "$(jq 'length' <<<"$rows")" -eq 0 || { echo "$table is not empty"; exit 1; }
          done
          echo 'Canonical paper history reset verified.'
