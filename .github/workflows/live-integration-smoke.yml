name: Live Integration Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Cloudflare Worker health
        env:
          WORKER_URL: https://ai-multi-agent-trading-bot.arimamadeii.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$WORKER_URL/api/system/health" | tee /tmp/health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('status') in ('ok','healthy','degraded'), data
          print('worker_health_ok', data.get('status'))
          PY

      - name: Deep Supabase smoke probe
        env:
          WORKER_URL: https://ai-multi-agent-trading-bot.arimamadeii.workers.dev
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 20 -o /tmp/deep.json -w '%{http_code}' "$WORKER_URL/api/system/health?deep=1")
          cat /tmp/deep.json
          python - "$code" <<'PY'
          import json, sys
          code=int(sys.argv[1])
          data=json.load(open('/tmp/deep.json'))
          db=data.get('database') or data.get('system_health',{}).get('database') or {}
          print('deep_http', code, 'database_reason', db.get('reason'), 'connected', db.get('connected'))
          if code >= 500:
              raise SystemExit('worker deep health returned server error')
          if db.get('reason') == 'credentials_missing':
              raise SystemExit('Supabase runtime credential is missing in Cloudflare Worker')
          if db.get('connected') is False:
              raise SystemExit(f'Supabase deep probe failed: {db}')
          PY

      - name: Check FastAPI URL contract when configured
        env:
          AI_ENGINE_URL: ${{ vars.AI_ENGINE_URL }}
        if: ${{ vars.AI_ENGINE_URL != '' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$AI_ENGINE_URL/health"
          curl --fail --silent --show-error --max-time 20 "$AI_ENGINE_URL/ready"
