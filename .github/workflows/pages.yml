name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "public/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Build official FreqUI
        env:
          VITE_BOT_API_URL: https://ai-multi-agent-trading-bot-e5328952.fastapicloud.dev
          FREQUI_COMMIT: 5cade05d3fef32dee505609eff1a374d80939083
        run: |
          git init /tmp/frequi
          cd /tmp/frequi
          git remote add origin https://github.com/freqtrade/frequi.git
          git fetch --depth 1 origin "${FREQUI_COMMIT}"
          git checkout --detach "${FREQUI_COMMIT}"
          python3 - <<'PY'
          from pathlib import Path

          vite = Path("vite.config.ts")
          text = vite.read_text()
          marker = "export default defineConfig({\n"
          replacement = "export default defineConfig({\n  base: '/ai-multi-agent-trading-bot/',\n"
          if replacement not in text:
              if marker not in text:
                  raise SystemExit("Could not locate Vite config marker")
              text = text.replace(marker, replacement, 1)
              vite.write_text(text)

          login = Path("src/components/BotLogin.vue")
          text = login.read_text()
          text = text.replace(
              "const defaultURL = window.location.origin || 'http://localhost:3000';",
              "const defaultURL = import.meta.env.VITE_BOT_API_URL || window.location.origin || 'http://localhost:3000';",
              1,
          )
          text = text.replace("botName: '',", "botName: 'compound-scalper',", 1)
          text = text.replace("username: '',", "username: 'doushitekana',", 1)
          text = text.replace("auth.value.botName = '';", "auth.value.botName = 'compound-scalper';", 1)
          text = text.replace("auth.value.username = '';", "auth.value.username = 'doushitekana';", 1)
          text = text.replace("      urlState.value = false;", "      urlState.value = true;", 1)
          text = text.replace('<UFormField class="mb-4" label="Bot Name">', '<UFormField class="hidden" label="Bot Name">', 1)
          text = text.replace('      class="mb-4"\n      label="API Url"', '      class="hidden"\n      label="API Url"', 1)
          text = text.replace('      class="mb-4"\n      label="Username"', '      class="hidden"\n      label="Username"', 1)
          text = text.replace('label="Submit" color="primary" type="submit"', 'label="Login" color="primary" type="submit"', 1)
          login.write_text(text)
          PY
          pnpm install --frozen-lockfile
          pnpm run build
          cd -
          rm -rf public
          cp -R /tmp/frequi/dist public
          cp public/index.html public/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
