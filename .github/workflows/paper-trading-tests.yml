name: Paper Trading Execution Tests

on:
  push:
    branches:
      - main
      - indodax-integration-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Test scope"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - execution
          - strategy

permissions:
  contents: read

jobs:
  paper-tests:
    name: Paper trading audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      TEST_SCOPE: ${{ inputs.test_scope || 'full' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install CI test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests ccxt

      - name: Verify exchange dependency
        run: |
          python - <<'PY'
          import ccxt
          from exchange_integration.indodax_bridge import IndodaxBridge
          print(f"ccxt version: {ccxt.__version__}")
          print(f"Indodax bridge import: {IndodaxBridge.__name__}")
          PY

      - name: Compile trading source
        run: |
          python -m compileall -q agents backend core exchange_integration integration paper_trading main.py

      - name: Run execution tests
        if: env.TEST_SCOPE == 'full' || env.TEST_SCOPE == 'execution'
        run: |
          pytest -q tests/test_paper_execution.py tests/test_executor_risk.py

      - name: Run adaptive scalping tests
        if: env.TEST_SCOPE == 'full' || env.TEST_SCOPE == 'strategy'
        run: |
          pytest -q tests/test_adaptive_scalping.py

      - name: Run Trading Librarian import test
        if: env.TEST_SCOPE == 'full'
        run: |
          python - <<'PY'
          from agents.agent_trading_librarian import TradingLibrarianAgent
          librarian = TradingLibrarianAgent()
          result = librarian.advise('scalping risk momentum')
          assert result['advisory_only'] is True
          assert result['knowledge']
          print(f"Librarian knowledge entries: {len(result['knowledge'])}")
          PY

      - name: Run public Indodax market-data smoke test
        if: env.TEST_SCOPE == 'full'
        run: |
          python - <<'PY'
          import requests
          url = 'https://indodax.com/api/btc_idr/ticker'
          response = requests.get(url, timeout=10)
          response.raise_for_status()
          payload = response.json()
          price = float(payload['ticker']['last'])
          assert price > 0
          print(f"Indodax BTC/IDR public price: {price}")
          print("READ-ONLY: no credentials and no private order endpoint used.")
          PY

      - name: Audit result
        if: always()
        run: |
          echo "Paper trading audit completed. Scope=${TEST_SCOPE}"
          echo "Live trading remains disabled; this workflow is read-only against Indodax public data."
