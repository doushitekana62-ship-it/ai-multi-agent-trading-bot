name: Paper Trading Execution Tests

on:
  push:
    branches:
      - main
      - indodax-integration-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Test scope"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - execution
          - strategy

permissions:
  contents: read

jobs:
  paper-tests:
    name: Paper trading audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      TEST_SCOPE: ${{ inputs.test_scope || 'full' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install CI test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-timeout requests ccxt numpy pandas scipy scikit-learn textblob ta

      - name: Verify exchange and AI dependencies
        run: |
          python - <<'PY'
          import ccxt, numpy, pandas, scipy, sklearn
          from textblob import TextBlob
          from exchange_integration.indodax_bridge import IndodaxBridge
          print(f"ccxt: {ccxt.__version__}")
          print(f"numpy: {numpy.__version__}")
          print(f"pandas: {pandas.__version__}")
          print(f"scipy: {scipy.__version__}")
          print(f"scikit-learn: {sklearn.__version__}")
          print(f"TextBlob: {TextBlob}")
          print(f"Indodax bridge: {IndodaxBridge.__name__}")
          PY

      - name: Compile trading source
        run: |
          python -m compileall -q agents backend core exchange_integration integration paper_trading main.py

      - name: Run execution tests
        if: env.TEST_SCOPE == 'full' || env.TEST_SCOPE == 'execution'
        run: |
          pytest -q tests/test_paper_execution.py tests/test_executor_risk.py

      - name: Run adaptive scalping tests
        if: env.TEST_SCOPE == 'full' || env.TEST_SCOPE == 'strategy'
        run: |
          pytest -q tests/test_adaptive_scalping.py tests/test_scalping_controller.py

      - name: Run 50-cycle scalping execution audit
        if: env.TEST_SCOPE == 'full' || env.TEST_SCOPE == 'strategy'
        run: |
          pytest -q tests/test_50_cycle_scalping.py

      - name: Run real-market Indodax paper-cycle integration
        if: env.TEST_SCOPE == 'full' || env.TEST_SCOPE == 'strategy'
        timeout-minutes: 5
        run: |
          pytest -q tests/test_live_market_paper_cycle.py -o log_cli=true --log-cli-level=INFO

      - name: Run Trading Librarian import test
        if: env.TEST_SCOPE == 'full'
        run: |
          python - <<'PY'
          from agents.agent_trading_librarian import TradingLibrarianAgent
          librarian = TradingLibrarianAgent()
          result = librarian.advise('scalping risk momentum')
          assert result['advisory_only'] is True
          assert result['knowledge']
          print(f"Librarian knowledge entries: {len(result['knowledge'])}")
          PY

      - name: Run public Indodax market-data smoke test
        if: env.TEST_SCOPE == 'full'
        run: |
          python - <<'PY'
          import requests
          response = requests.get('https://indodax.com/api/btc_idr/ticker', timeout=10)
          response.raise_for_status()
          payload = response.json()
          price = float(payload['ticker']['last'])
          assert price > 0
          print(f"Indodax BTC/IDR public price: {price}")
          print("READ-ONLY: no credentials and no private order endpoint used.")
          PY

      - name: Publish paper-cycle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-audit-reports
          path: test_results/
          if-no-files-found: warn

      - name: Audit result
        if: always()
        run: |
          echo "Paper trading audit completed. Scope=${TEST_SCOPE}"
          echo "Live trading remains disabled; this workflow is read-only against Indodax public data."
