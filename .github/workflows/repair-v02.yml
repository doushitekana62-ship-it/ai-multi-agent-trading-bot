name: Apply V0.2 Ledger Runtime Repair
on:
  push:
    branches: [repair/v02-ledger-runtime]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v02-ledger-repair
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply repair patch
        run: python .github/repair_v02.py
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fronted/paper_state.py fronted/cf_worker.py fronted/paper_cycle.py supabase/migrations/20260901100000_execution_ledger_reconciliation.sql tests/test_v02_ledger_consistency.py
          git diff --cached --quiet && exit 0
          git commit -m 'Repair V0.2 execution ledger and worker runtime'
          git push origin HEAD:repair/v02-ledger-runtime
