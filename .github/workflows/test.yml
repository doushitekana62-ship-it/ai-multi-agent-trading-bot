name: Test Trading Bot

on:
  push:
    branches: [main, integrate/freqtrade-core]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Compile Python sources
        run: python -m compileall -q app user_data/strategies vendor/freqtrade/freqtrade
      - name: Test restored scalping brain
        run: python -m unittest tests/test_scalping_brain.py -v
      - name: Build vendored Freqtrade wheel
        run: python -m pip wheel --no-deps --no-build-isolation ./vendor/freqtrade -w /tmp/freqtrade-wheel
      - name: Import Freqtrade package
        run: python -m pip install --no-deps /tmp/freqtrade-wheel/*.whl && python -c "import freqtrade; print(freqtrade.__version__)"
