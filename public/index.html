<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compound Scalping</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header><h1>Compound Scalping</h1><span id="state">OFFLINE</span></header>

    <section id="login" class="card">
      <h2>Dashboard access</h2>
      <input id="token" type="password" placeholder="Dashboard token" autocomplete="current-password">
      <button id="loginBtn">Connect</button>
      <p id="loginMsg"></p>
    </section>

    <section id="dashboard" hidden>
      <div class="grid">
        <article class="card"><small>Engine</small><strong id="engine">—</strong></article>
        <article class="card"><small>API</small><strong id="api">—</strong></article>
        <article class="card"><small>Positions</small><strong id="positions">—</strong></article>
      </div>

      <article class="card">
        <div class="row">
          <h2>Engine control</h2>
          <div>
            <button id="startEngine">Start</button>
            <button id="stopEngine">Stop</button>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="row">
          <h2>Recent data</h2>
          <div><button id="refresh">Refresh</button><button id="logout">Disconnect</button></div>
        </div>
        <pre id="data">Loading…</pre>
      </article>
    </section>
  </main>

  <script src="./config.js"></script>
  <script src="./app-static.js"></script>
</body>
</html>
