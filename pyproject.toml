[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-multi-agent-trading-bot-api"
version = "1.0.1"
description = "FastAPI Cloud control/AI service for the AI multi-agent paper-trading bot"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "textblob>=0.18,<1",
]

[tool.fastapi]
entrypoint = "fastapi_cloud_app:app"

[tool.setuptools]
py-modules = ["fastapi_cloud_app"]

[tool.setuptools.packages.find]
include = [
    "agents*",
    "backend*",
    "core*",
    "exchange_integration*",
    "integration*",
    "paper_trading*",
]
exclude = [
    "data*",
    "fronted*",
    "logs*",
    "test_result*",
    "tests*",
]
