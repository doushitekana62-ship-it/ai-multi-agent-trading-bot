[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-multi-agent-trading-bot-api"
version = "2.0.0"
description = "Canonical FastAPI service for the AI multi-agent paper-trading bot"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "textblob>=0.18,<1",
    "requests>=2.32,<3",
    "ccxt>=4.4,<5",
    "ta>=0.11,<1",
    "supabase>=2.0,<3",
    "PyJWT>=2.9,<3",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.3.0",
    "python-dotenv>=1.0,<2",
    "cryptography>=43,<47",
    "python-multipart>=0.0.9,<1",
]

[tool.fastapi]
entrypoint = "backend.api:app"

[tool.setuptools]
packages = [
    "agents",
    "backend",
    "backend.core",
    "backend.routes",
    "core",
    "exchange_integration",
    "integration",
    "paper_trading",
]
py-modules = []
